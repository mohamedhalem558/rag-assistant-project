<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Assistant</title>
  <meta name="description" content="Ask questions and get AI-powered answers from your document knowledge base." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface:  { 1: '#0f1117', 2: '#1a1d2e', 3: '#242840' },
            accent:   { DEFAULT: '#6366f1', light: '#818cf8', dim: '#4f46e5' },
            mint:     { DEFAULT: '#34d399', light: '#6ee7b7' },
          },
          animation: {
            'fade-up':    'fadeUp .45s ease-out both',
            'pulse-slow': 'pulse 2.5s cubic-bezier(.4,0,.6,1) infinite',
          },
          keyframes: {
            fadeUp: {
              '0%':   { opacity: 0, transform: 'translateY(12px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
          },
        },
      },
    };
  </script>

  <!-- Google Fonts – Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Marked.js for rendering Markdown answers -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <style>
    /* ── Base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* Subtle radial glow behind the card */
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 55% 40% at 50% 0%, rgba(99,102,241,.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 80% 100%, rgba(52,211,153,.07) 0%, transparent 60%);
    }

    /* Glass card */
    .glass {
      background: rgba(26, 29, 46, .55);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255,255,255,.06);
    }

    /* Typing dots */
    .dot { animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -.32s; }
    .dot:nth-child(2) { animation-delay: -.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Markdown answer styles */
    #answer-text h1, #answer-text h2, #answer-text h3 { font-weight: 600; margin: .75em 0 .35em; color: #f1f5f9; }
    #answer-text h1 { font-size: 1.25rem; }
    #answer-text h2 { font-size: 1.1rem; }
    #answer-text p  { margin: .45em 0; line-height: 1.7; }
    #answer-text ul, #answer-text ol { padding-left: 1.5em; margin: .45em 0; }
    #answer-text li { margin: .2em 0; line-height: 1.65; }
    #answer-text code {
      background: rgba(99,102,241,.15); padding: .15em .35em;
      border-radius: .25rem; font-size: .88em; color: #c7d2fe;
    }
    #answer-text pre {
      background: rgba(15,17,23,.7); border: 1px solid rgba(255,255,255,.06);
      border-radius: .5rem; padding: .85rem 1rem; overflow-x: auto; margin: .6em 0;
    }
    #answer-text pre code { background: none; padding: 0; color: #cbd5e1; }
    #answer-text a { color: #818cf8; text-decoration: underline; }
    #answer-text blockquote {
      border-left: 3px solid #6366f1; padding-left: .85rem; color: #94a3b8; margin: .6em 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

    /* Transition helpers */
    .transition-smooth { transition: all .25s cubic-bezier(.4,0,.2,1); }

    /* Focus ring */
    .focus-ring:focus-visible {
      outline: 2px solid #6366f1; outline-offset: 2px;
    }
  </style>
</head>

<body class="flex items-center justify-center px-4 py-10">

  <!-- Background glow -->
  <div class="bg-glow"></div>

  <!-- Main container -->
  <main class="relative z-10 w-full max-w-2xl flex flex-col gap-6">

    <!-- ── Header ──────────────────────────────────────── -->
    <header class="text-center space-y-2 animate-fade-up">
      <div class="inline-flex items-center gap-2.5 mb-1">
        <!-- Logo icon -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent to-mint flex items-center justify-center shadow-lg shadow-accent/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 0 0-2.455 2.456Z" />
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
          RAG Assistant
        </h1>
      </div>
      <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
        Ask anything about your documents — powered by retrieval-augmented generation.
      </p>
    </header>

    <!-- ── Input card ──────────────────────────────────── -->
    <section class="glass rounded-2xl p-5 shadow-xl shadow-black/20 animate-fade-up" style="animation-delay:.08s">
      <form id="query-form" class="flex gap-3">
        <label for="question-input" class="sr-only">Your question</label>
        <input
          id="question-input"
          type="text"
          required
          autofocus
          placeholder="e.g. What are the key findings in the report?"
          style="color: #111827; caret-color: #111827;"
          class="focus-ring flex-1 bg-white border border-slate-300 rounded-xl px-4 py-3 text-sm text-gray-900 placeholder-gray-400 transition-smooth hover:border-slate-400 focus:border-accent focus:ring-2 focus:ring-accent/20"
        />
        <button
          id="submit-btn"
          type="submit"
          class="focus-ring inline-flex items-center gap-2 bg-gradient-to-r from-accent to-accent-dim hover:from-accent-light hover:to-accent text-white font-medium text-sm px-5 py-3 rounded-xl shadow-lg shadow-accent/20 transition-smooth active:scale-[.97] disabled:opacity-40 disabled:pointer-events-none"
        >
          <!-- Arrow icon -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
          </svg>
          <span id="btn-label">Ask</span>
        </button>
      </form>
    </section>

    <!-- ── Loading indicator ───────────────────────────── -->
    <section id="loading" class="hidden flex items-center justify-center gap-1.5 py-6">
      <span class="dot w-2 h-2 rounded-full bg-accent"></span>
      <span class="dot w-2 h-2 rounded-full bg-accent"></span>
      <span class="dot w-2 h-2 rounded-full bg-accent"></span>
      <span class="ml-3 text-sm text-slate-400">Thinking…</span>
    </section>

    <!-- ── Answer card ─────────────────────────────────── -->
    <section id="answer-card" class="hidden glass rounded-2xl shadow-xl shadow-black/20 overflow-hidden animate-fade-up">
      <!-- Answer -->
      <div class="p-6 space-y-1">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-6 h-6 rounded-lg bg-mint/15 flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-mint" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </div>
          <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400">Answer</h2>
        </div>
        <div id="answer-text" class="text-sm text-slate-200 leading-relaxed"></div>
      </div>

      <!-- Sources -->
      <div id="sources-section" class="hidden border-t border-white/[.06] bg-surface-1/30 px-6 py-4">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-6 h-6 rounded-lg bg-accent/15 flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-accent-light" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
          </div>
          <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-400">Sources</h2>
        </div>
        <ul id="sources-list" class="space-y-1.5"></ul>
      </div>
    </section>

    <!-- ── Error card ──────────────────────────────────── -->
    <section id="error-card" class="hidden glass rounded-2xl p-5 border border-red-500/20 shadow-xl shadow-black/20 animate-fade-up">
      <div class="flex items-start gap-3">
        <div class="w-6 h-6 rounded-lg bg-red-500/15 flex items-center justify-center mt-0.5">
          <svg class="w-3.5 h-3.5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-medium text-red-300">Something went wrong</p>
          <p id="error-text" class="text-xs text-slate-400 mt-1"></p>
        </div>
      </div>
    </section>

    <!-- ── Footer ──────────────────────────────────────── -->
    <footer class="text-center text-[11px] text-slate-600 pt-2">
      RAG Assistant · Powered by Ollama + ChromaDB
    </footer>

  </main>

  <!-- ── Script ──────────────────────────────────────── -->
  <script>
    const API_URL = 'http://127.0.0.1:8000/api/query';

    // DOM refs
    const form       = document.getElementById('query-form');
    const input      = document.getElementById('question-input');
    const submitBtn  = document.getElementById('submit-btn');
    const btnLabel   = document.getElementById('btn-label');
    const loading    = document.getElementById('loading');
    const answerCard = document.getElementById('answer-card');
    const answerText = document.getElementById('answer-text');
    const srcSection = document.getElementById('sources-section');
    const srcList    = document.getElementById('sources-list');
    const errorCard  = document.getElementById('error-card');
    const errorText  = document.getElementById('error-text');

    // ── Helpers ─────────────────────────────────────────
    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    function setLoading(on) {
      submitBtn.disabled = on;
      if (on) {
        btnLabel.textContent = 'Sending…';
        show(loading);
        hide(answerCard);
        hide(errorCard);
      } else {
        btnLabel.textContent = 'Ask';
        hide(loading);
      }
    }

    function renderSources(sources) {
      srcList.innerHTML = '';
      if (!sources || sources.length === 0) {
        hide(srcSection);
        return;
      }
      show(srcSection);
      sources.forEach((src, i) => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2 text-xs text-slate-400';
        li.innerHTML = `
          <span class="select-none mt-px text-accent-light/60 font-mono">${i + 1}.</span>
          <span class="leading-relaxed break-all">${escapeHtml(src)}</span>
        `;
        srcList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Submit handler ──────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      setLoading(true);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Server responded with ${res.status}`);
        }

        const data = await res.json();

        // Render answer as Markdown
        answerText.innerHTML = typeof marked !== 'undefined'
          ? marked.parse(data.answer || 'No answer returned.')
          : `<p>${escapeHtml(data.answer || 'No answer returned.')}</p>`;

        renderSources(data.sources);
        show(answerCard);
      } catch (err) {
        errorText.textContent = err.message || 'Failed to reach the server.';
        show(errorCard);
      } finally {
        setLoading(false);
      }
    });

    // Allow Ctrl+Enter / ⌘+Enter to submit
    input.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        form.requestSubmit();
      }
    });
  </script>

</body>
</html>
